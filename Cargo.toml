[workspace]
resolver = "2"
members = [
  "crates/millo-audit",
  "crates/millo-cam",
  "crates/millo-command",
  "crates/millo-controller",
  "crates/millo-dry-run",
  "crates/millo-domain",
  "crates/millo-gcode",
  "crates/millo-grbl",
  "crates/millo-mock",
  "crates/millo-journal",
  "crates/millo-profile",
  "crates/millo-readiness",
  "crates/millo-recovery",
  "crates/millo-run",
  "crates/millo-safety",
  "crates/millo-settings",
  "crates/millo-sender",
  "crates/millo-serial",
  "crates/millo-storage",
  "crates/millo-tooling",
  "crates/millo-transport",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
