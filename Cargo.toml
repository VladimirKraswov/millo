[workspace]
resolver = "2"
exclude = ["vendor/glib"]
members = [
  "crates/millo-audit",
  "crates/millo-cam",
  "crates/millo-command",
  "crates/millo-controller",
  "crates/millo-dry-run",
  "crates/millo-domain",
  "crates/millo-gcode",
  "crates/millo-grbl",
  "crates/millo-heightmap",
  "crates/millo-mock",
  "crates/millo-pcb",
  "crates/millo-platform-tests",
  "crates/millo-preferences",
  "crates/millo-journal",
  "crates/millo-profile",
  "crates/millo-readiness",
  "crates/millo-recovery",
  "crates/millo-restart",
  "crates/millo-run",
  "crates/millo-safety",
  "crates/millo-settings",
  "crates/millo-sender",
  "crates/millo-serial",
  "crates/millo-script",
  "crates/millo-storage",
  "crates/millo-tooling",
  "crates/millo-transport",
  "crates/millo-virtual-controller",
  "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
rhai = { version = "1.25.1", features = ["serde", "sync"] }

[patch.crates-io]
# GTK3 requires glib 0.18; backport RUSTSEC-2024-0429 without an ABI migration.
glib = { path = "vendor/glib" }
