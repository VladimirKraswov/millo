[workspace]
resolver = "2"
members = [
  "crates/millo-command",
  "crates/millo-controller",
  "crates/millo-domain",
  "crates/millo-gcode",
  "crates/millo-grbl",
  "crates/millo-mock",
  "crates/millo-readiness",
  "crates/millo-safety",
  "crates/millo-serial",
  "crates/millo-transport",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
