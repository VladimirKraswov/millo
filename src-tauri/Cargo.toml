[package]
name = "millo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Millo desktop adapter"

[lib]
name = "millo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
millo-controller = { path = "../crates/millo-controller" }
millo-domain = { path = "../crates/millo-domain" }
millo-mock = { path = "../crates/millo-mock" }
serde.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
