[package]
name = "millo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Millo desktop adapter"

[lib]
name = "millo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
millo-audit = { path = "../crates/millo-audit" }
millo-cam = { path = "../crates/millo-cam" }
millo-command = { path = "../crates/millo-command" }
millo-controller = { path = "../crates/millo-controller" }
millo-dry-run = { path = "../crates/millo-dry-run" }
millo-domain = { path = "../crates/millo-domain" }
millo-gcode = { path = "../crates/millo-gcode" }
millo-grbl = { path = "../crates/millo-grbl" }
millo-heightmap = { path = "../crates/millo-heightmap" }
millo-journal = { path = "../crates/millo-journal" }
millo-mock = { path = "../crates/millo-mock" }
millo-profile = { path = "../crates/millo-profile" }
millo-recovery = { path = "../crates/millo-recovery" }
millo-restart = { path = "../crates/millo-restart" }
millo-run = { path = "../crates/millo-run" }
millo-serial = { path = "../crates/millo-serial" }
millo-script = { path = "../crates/millo-script" }
millo-settings = { path = "../crates/millo-settings" }
millo-sender = { path = "../crates/millo-sender" }
millo-tooling = { path = "../crates/millo-tooling" }
millo-transport = { path = "../crates/millo-transport" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
